openapi: 3.0.0
info:
  title: TaskTeam BFF API
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login success
        '401':
          description: Invalid credentials
  /dashboard/overview:
    get:
      summary: Dashboard data
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard overview
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
